[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agens3"
version = "0.1.0"
description = "Agent orchestration for ns-3 network simulations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Kemal Yağız Daşkıran"}, {name = "Ali Berat Ak"}]
dependencies = [
  "openai>=1.82,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "chromadb>=1.0,<2",
  "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
agens3 = "agens3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
